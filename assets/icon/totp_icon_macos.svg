<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024"
     viewBox="0 0 1024 1024" role="img" aria-label="lzy_totp 应用图标">
  <title>lzy_totp — TOTP 验证器</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07302F"/>
      <stop offset="1" stop-color="#0B4A47"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <radialGradient id="glow" cx="0.28" cy="0.18" r="0.85">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="translate(512.0 512.0) scale(0.781250) translate(-512.0 -512.0)">
    <!-- 圆角底板 + 柔光 + 内侧描边 -->
    <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>
    <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#glow)"/>
    <rect x="6" y="6" width="1012" height="1012" rx="222"
          fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="6"/>
  </g>

  <!-- totp 字标：o 即倒计时圆环 -->
  <g filter="url(#soft-shadow)" transform="translate(512.0 512.0) scale(0.60509) translate(-356.00 -510.00)">
    <g id="wordmark"><path d="M 0.0 316 V 620 M -52.0 432 H 64.0" fill="none" stroke="#EAFFFC" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/><path d="M 440.0 316 V 620 M 388.0 432 H 504.0" fill="none" stroke="#EAFFFC" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/><path d="M 580.0 420 V 704" fill="none" stroke="#EAFFFC" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/><circle cx="660.0" cy="520.0" r="80.0" fill="none" stroke="#EAFFFC" stroke-width="48"/></g>
    <g id="countdown-o"><circle cx="220.0" cy="520.0" r="80.0" fill="none" stroke="rgba(234,255,252,0.22)" stroke-width="48"/><circle cx="220.0" cy="520.0" r="80.0" fill="none" stroke="#2DD4BF" stroke-width="48" stroke-linecap="round" stroke-dasharray="341.81 160.85" transform="rotate(-90 220.0 520.0)"/><circle cx="147.6" cy="554.1" r="24.0" fill="#7DF9E4"/></g>
  </g>
</svg>
